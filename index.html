        /* CSS TỐI ƯU CHO ĐIỆN THOẠI */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.5; color: #333; background: #f0f2f5; padding: 10px; }
        
        .container { width: 100%; max-width: 100%; margin: 0 auto; background: white; border-radius: 10px; overflow: hidden; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        /* Menu Điều Hướng Mới */
        .nav-menu { margin-bottom: 20px; padding: 15px; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; }
        .nav-menu h3 { margin-bottom: 10px; color: #0d47a1; font-size: 1rem; }
        .nav-list { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
        .nav-list li a { text-decoration: none; padding: 8px 12px; background: #e3f2fd; border-radius: 6px; color: #1e88e5; font-size: 0.85rem; font-weight: 500; display: block; }
        .nav-list li a:hover { background: #1e88e5; color: white; }

        /* Header */
        header { text-align: center; margin: -15px -15px 20px -15px; padding: 20px 15px; background: linear-gradient(135deg, #1e88e5, #0d47a1); color: white; }
        header h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
        
        /* Các phần còn lại giữ nguyên như mã cũ của bạn */
        .form-section { background: white; border-radius: 8px; padding: 15px; margin-bottom: 20px; border: 1px solid #e0e0e0; }
        .section-title { font-size: 1.2rem; color: #0d47a1; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #1e88e5; display: flex; align-items: center; gap: 10px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 600; color: #444; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
        .form-control { width: 100%; padding: 10px 12px; font-size: 1rem; border: 1px solid #ddd; border-radius: 6px; background: #fafafa; }
        .btn-copy { background: #1e88e5; color: white; border: none; border-radius: 6px; padding: 10px 12px; cursor: pointer; }
        .btn { padding: 12px 16px; font-size: 1rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin: 5px; }
        .btn-primary { background: #1e88e5; color: white; }
        .btn-success { background: #4caf50; color: white; }
        .btn-warning { background: #ff9800; color: white; }
        .btn-danger { background: #f44336; color: white; }
        .table-responsive { width: 100%; overflow-x: auto; margin: 15px 0; border: 1px solid #e0e0e0; border-radius: 6px; }
        .data-table { width: 100%; min-width: 1000px; border-collapse: collapse; font-size: 0.85rem; }
        .data-table thead { background: #0d47a1; color: white; }
        .data-table th, .data-table td { padding: 12px 8px; border-bottom: 1px solid #eee; text-align: left; }
